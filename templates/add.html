{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Criar Novo Hábito</h3>

        <form action="/add" method="post">
            <div class="mb-3 text-start">
                <label for="title" class="form-label">Nome do Hábito</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="Ex: Ler 10 páginas, Beber água..." required autofocus>
            </div>

            <div class="mb-4 text-start">
                <label for="frequency" class="form-label">Frequência</label>
                <select class="form-select" id="frequency" name="frequency">
                    <option value="daily" selected>Diário</option>
                    <option value="weekly">Semanal</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2">Salvar Hábito</button>
            <a href="/" class="btn btn-outline-secondary w-100">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
